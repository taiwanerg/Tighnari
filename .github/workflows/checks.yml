name: Cross-platform source and package checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/tighnari_seisloc start.py
      - run: ruff check src/tighnari_seisloc
      - run: ruff format --check src/tighnari_seisloc start.py saiu_eew
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/tighnari_seisloc/web/common.js
      - run: node --check src/tighnari_seisloc/web/dashboard.js
      - run: node --check src/tighnari_seisloc/web/detail.js
      - run: node --check src/tighnari_seisloc/web/records.js
      - run: node --check src/tighnari_seisloc/web/hoshi.js
      - run: node --check src/tighnari_seisloc/web/hoshi-challenge.js
      - run: python -m pip install --force-reinstall --no-deps dist/tighnari_seisloc-0.2.0-py3-none-any.whl
      - run: python -c "import tighnari_seisloc; print(tighnari_seisloc.__version__)"
