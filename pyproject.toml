[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tighnari-seisloc"
version = "0.2.0"
description = "Open regional earthquake location and waveform observatory"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["seismology", "earthquake", "taiwan", "phasenet", "seedlink", "earthquake-location"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "obspy>=1.4,<2", "Pillow>=10,<14", "tzdata>=2024.1", "shapely>=2,<3", "pyproj>=3.6,<4", "pyshp>=2.3,<4"]

[project.urls]
Homepage = "https://github.com/taiwanerg/Tighnari-SeisLOC"
Issues = "https://github.com/taiwanerg/Tighnari-SeisLOC/issues"

[project.optional-dependencies]
ml = ["seisbench==0.12.7", "torch==2.15.0"]
cmt = ["numpy>=1.26,<2", "pandas<3", "pyrocko>=2025.1,<2027"]
gdms-edge = ["selenium==4.53.0"]
dev = ["ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
tighnari-seisloc = "tighnari_seisloc.cli:main"
saiu-locator = "tighnari_seisloc.cli:legacy_main"
saiu-eew = "tighnari_seisloc.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tighnari_seisloc*", "saiu_eew"]
exclude = ["tests*", "data*", "docs*", "build*", "runtime*"]

[tool.setuptools.package-data]
tighnari_seisloc = ["web/*", "assets/*", "legacy/assets/*", "legacy/web/*"]

[tool.ruff]
line-length = 100
exclude = ["build", "runtime", "data", "output", ".venv", "src/tighnari_seisloc/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
